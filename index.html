<style>
:root {
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;

  --border: #e5e7eb;
  --border-light: #f1f2f4;
  --text: #111827;
  --muted: #6b7280;
  --faint: #9ca3af;
  --accent: #16354f;
  --accent-hover: #0e2338;
  --accent-soft: #eaf0f5;
  --accent-icon: #16354f;
  --link: #16354f;
  --row-hover: #f9fafb;
  --tab-bg: #f3f4f6;
  --info-soft: #eff6ff; --info-border: #bfdbfe; --info-icon: #2563eb; --info-text: #1e3a8a;
  --ok-soft: #f0fdf4; --ok-border: #bbf7d0; --ok: #16a34a; --ok-text: #166534;
  --warn-soft: #fffbeb; --warn-border: #f5d78e; --warn: #b45309; --warn-text: #92400e;

}
@media (prefers-color-scheme: dark) {

    --text: #f5f5f5; --muted: #a1a1aa; --faint: #71717a;
    --accent: #2b5a80; --accent-hover: #36699a; --accent-soft: #1a2c3a; --accent-icon: #8fb8d9; --link: #8fb8d9;
    --row-hover: #18181b; --tab-bg: #1c1c1f;
    --info-soft: #16233a; --info-border: #1e3a5f; --info-icon: #60a5fa; --info-text: #bfdbfe;
    --ok-soft: #0f2a1c; --ok-border: #1e4a30; --ok: #4ade80; --ok-text: #bbf7d0;
    --warn-soft: #2e2410; --warn-border: #4a3a10; --warn: #f0b859; --warn-text: #fde68a;
    --bad-soft: #2c1212; --bad-border: #4c1d1d; --bad: #f87171;
    --ai-soft: #1f1836; --ai-border: #3b2d66; --ai: #c4b5fd;

}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --nav-bg: #111113; --border: #27272a; --border-light: #1c1c1f;
  --text: #f5f5f5; --muted: #a1a1aa; --faint: #71717a;
  --accent: #2b5a80; --accent-hover: #36699a; --accent-soft: #1a2c3a; --accent-icon: #8fb8d9; --link: #8fb8d9;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }

svg.lucide { width: 16px; height: 16px; flex-shrink: 0; }

.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }

/* Sidebar — mirrors Shepherd's nav */
.nav { background: var(--nav-bg); border-right: 1px solid var(--border); padding: 28px 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.nav__brand { display: flex; align-items: center; gap: 10px; padding: 0 4px 20px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
.nav__brand-mark { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.nav__brand-mark svg.lucide { width: 20px; height: 20px; }
.nav__brand-name { font-family: var(--font-head); font-size: 19px; line-height: 1.1; }
.nav__brand-kind { font-size: 12px; color: var(--muted); }
.nav__label { padding: 16px 10px 6px; color: var(--faint); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.nav__item { display: flex; align-items: center; gap: 14px; padding: 8px 10px; border-radius: 6px; color: var(--muted); font-size: 14px; font-weight: 500; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; }
.nav__item span.grow { flex: 1; }
.nav__item:hover { background: var(--bg); color: var(--text); }
.nav__item--active, .nav__item--active:hover { background: var(--accent-soft); color: var(--link); font-weight: 600; }
.nav__count { font-size: 11px; font-weight: 700; background: var(--info-icon); color: #fff; border-radius: 999px; padding: 1px 7px; }
.nav__spacer { flex: 1; }
.nav__account { display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--border); margin-top: 12px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--link); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.nav__account small { display: block; color: var(--muted); font-size: 12px; }

.main { padding-block: 32px 64px; padding-inline: 40px; min-width: 0; }
.mock-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.mock-note b { color: var(--text); font-weight: 600; }

/* Page chrome */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.page-head h1 { margin: 0 0 6px; font-size: 30px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.page-head p { margin: 0; color: var(--muted); }
.date { color: var(--muted); padding-top: 8px; white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; font-size: 13px; margin-bottom: 14px; }
.back:hover { color: var(--text); }
.section { margin-top: 32px; }
.section h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
.section-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-row h2 { margin: 0; }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; font-size: 13px; font-weight: 600; padding: 8px 14px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--row-hover); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn--primary:hover { background: var(--accent-hover); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn svg.lucide { width: 15px; height: 15px; }

.grid-actions { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.qa { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); text-align: left; cursor: pointer; }
.qa:hover { border-color: var(--accent-icon); }
.icon-tile { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-icon); flex-shrink: 0; }
.icon-tile svg.lucide { width: 18px; height: 18px; }
.qa strong { display: block; font-size: 14px; font-weight: 600; }
.qa span.sub { color: var(--muted); font-size: 13px; }

.grid-stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.stat { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 8px; }
.stat .icon-tile { width: 48px; height: 48px; }
.stat .icon-tile svg.lucide { width: 22px; height: 22px; }
.stat strong { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat > span:not(.icon-tile) span { display: block; font-size: 13px; }
.stat em { font-style: normal; font-size: 12px; color: var(--muted); }

.two-col { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }

.card { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }

.activity { list-style: none; margin: 0; padding: 0; }
.activity li { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border-light); }
.activity li:last-child { border-bottom: 0; }
.activity .icon-tile { width: 32px; height: 32px; }
.activity .icon-tile svg.lucide { width: 16px; height: 16px; }
.activity p { margin: 0; font-size: 13px; }
.activity small { color: var(--muted); font-size: 12px; }
.icon-tile--ai { background: var(--ai-soft); color: var(--ai); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; border: 1px solid transparent; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill--quote { background: var(--tab-bg); color: var(--muted); border-color: var(--border); }
.pill--active { background: var(--ok-soft); color: var(--ok-text); border-color: var(--ok-border); }
.pill--waiting { background: var(--warn-soft); color: var(--warn-text); border-color: var(--warn-border); }
.pill--punch { background: var(--info-soft); color: var(--info-text); border-color: var(--info-border); }
.pill--done { background: var(--tab-bg); color: var(--faint); border-color: var(--border); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 7px; background: var(--tab-bg); color: var(--muted); white-space: nowrap; }
.tag svg.lucide { width: 12px; height: 12px; }
.tag--new { background: var(--ai-soft); color: var(--ai); }
.tag--mat { background: var(--warn-soft); color: var(--warn-text); }
.tag--sched { background: var(--info-soft); color: var(--info-text); }
.tag--money { background: var(--ok-soft); color: var(--ok-text); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--nav-bg); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--row-hover); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td .strong { font-weight: 600; }
td .sub { display: block; color: var(--muted); font-size: 12px; }

/* Inbox */
.inbox { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; min-height: 560px; }
.mail-list { border-right: 1px solid var(--border); background: var(--bg); }
.mail-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--border-light); padding: 14px 16px; cursor: pointer; }
.mail-item:hover { background: var(--row-hover); }
.mail-item--sel { background: var(--accent-soft); }
.mail-item--sel:hover { background: var(--accent-soft); }
.mail-item__top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.mail-item__from { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-item__time { color: var(--faint); font-size: 12px; white-space: nowrap; }
.mail-item__subj { font-size: 13px; margin: 2px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-item__tags { display: flex; gap: 6px; flex-wrap: wrap; }
.mail-item--filed .mail-item__from, .mail-item--filed .mail-item__subj { color: var(--muted); font-weight: 500; }
.mail-view { padding: 22px 26px; min-width: 0; }
.mail-view h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; text-wrap: balance; }
.mail-meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.mail-body { white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; border-left: 3px solid var(--border); padding: 2px 0 2px 14px; color: var(--text); max-width: 68ch; }
.extract { margin-top: 22px; border: 1px solid var(--ai-border); background: var(--ai-soft); border-radius: 10px; padding: 16px 18px; }
.extract__head { display: flex; align-items: center; gap: 8px; color: var(--ai); font-weight: 700; font-size: 13px; margin-bottom: 12px; }
.extract__head span.grow { flex: 1; }
.extract dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 12px; font-size: 13px; }
.extract dt { color: var(--muted); }
.extract dd { margin: 0; font-weight: 500; }
.extract h4 { margin: 14px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.extract .table-wrap { background: var(--bg); }
.extract__actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.filed-banner { display: flex; align-items: center; gap: 10px; margin-top: 22px; padding: 12px 14px; border: 1px solid var(--ok-border); background: var(--ok-soft); color: var(--ok-text); border-radius: 8px; font-size: 13px; }
.filed-banner button { margin-left: auto; }

/* Project detail */
.proj-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 13px; margin-top: 10px; }
.proj-meta span { display: inline-flex; align-items: center; gap: 6px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-top: 24px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab--active { color: var(--text); border-bottom-color: var(--accent-icon); font-weight: 600; }
.tab .count { font-size: 11px; background: var(--tab-bg); color: var(--muted); border-radius: 999px; padding: 0 7px; }
.tab-body { padding-top: 22px; }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kv > div { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.kv small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.kv b { font-size: 15px; font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--tab-bg); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }

.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 13.5px; }
.todo li:last-child { border-bottom: 0; }
.todo input { width: 16px; height: 16px; accent-color: var(--accent); }
.todo li.done span { color: var(--faint); text-decoration: line-through; }

.status-btn { cursor: pointer; border: 0; padding: 0; background: none; }
.mat-status { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 3px 9px; border: 1px solid; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.mat-status--needed { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-border); }
.mat-status--ordered { color: var(--warn-text); background: var(--warn-soft); border-color: var(--warn-border); }
.mat-status--onsite { color: var(--ok-text); background: var(--ok-soft); border-color: var(--ok-border); }
.mat-status svg.lucide { width: 12px; height: 12px; }

.notes { display: flex; flex-direction: column; gap: 12px; }
.note { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.note__head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.note__head b { color: var(--text); font-weight: 600; font-size: 13px; }
.note p { margin: 0; font-size: 13.5px; max-width: 70ch; white-space: pre-wrap; }
.composer { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.composer textarea { width: 100%; min-height: 70px; resize: vertical; border: 0; background: transparent; outline: none; }
.composer__row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.composer select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--bg); font-size: 13px; }

.callout { display: flex; align-items: flex-start; gap: 10px; background: var(--info-soft); border: 1px solid var(--info-border); border-radius: 8px; padding: 12px 14px; color: var(--info-text); font-size: 12.5px; line-height: 1.5; }
.callout svg.lucide { color: var(--info-icon); margin-top: 1px; }

.supplier { margin-bottom: 18px; }
.supplier h3 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.supplier h3 small { color: var(--muted); font-weight: 500; font-size: 12px; }

.toast { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; display: flex; gap: 8px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.empty { color: var(--muted); padding: 40px 20px; text-align: center; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--muted); }
.chip--on { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--link); font-weight: 600; }

@media (max-width: 980px) {
  .two-col { grid-template-columns: 1fr; }
  .inbox { grid-template-columns: 1fr; }
  .mail-list { border-right: 0; border-bottom: 1px solid var(--border); max-height: 320px; overflow-y: auto; }
}
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .nav { flex-direction: row; align-items: center; padding: 10px 16px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; gap: 2px; }
  .nav__brand { border: 0; padding: 0 10px 0 0; margin: 0; }
  .nav__brand-text, .nav__label, .nav__spacer, .nav__account { display: none; }
  .nav__item { width: auto; white-space: nowrap; gap: 8px; padding: 7px 10px; }
  .main { padding-inline: 16px; padding-block: 20px 48px; }
  .page-head h1 { font-size: 24px; }
  .mail-view { padding: 18px 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
}
</style>

<script>

const STATUS = {
  quote: ['Quoting', 'pill--quote'], active: ['In progress', 'pill--active'], waiting: ['Waiting on materials', 'pill--waiting'],
  punch: ['Punch list', 'pill--punch'], done: ['Complete', 'pill--done'],
};
const MAT = { needed: ['Needed', 'mat-status--needed', 'circle-alert'], ordered: ['Ordered', 'mat-status--ordered', 'clock'], onsite: ['On site', 'mat-status--onsite', 'circle-check'] };
const MAT_NEXT = { needed: 'ordered', ordered: 'onsite', onsite: 'needed' };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => '$' + n.toLocaleString('en-US');
const ic = (n) => `<i data-lucide="${n}"></i>`;
const proj = (id) => state.projects.find((p) => p.id === id);
const email = (id) => state.emails.find((e) => e.id === id);
const pill = (s) => `<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
const newEmails = () => state.emails.filter((e) => e.status === 'new').length;
const allMaterials = () => state.projects.filter((p) => p.status !== 'done').flatMap((p) => p.materials.map((m, i) => ({ ...m, p, i })));

function toast(msg) {
  const t = $('#toast');
  t.innerHTML = ic('circle-check') + esc(msg);
  t.hidden = false;
  icons();
  clearTimeout(toast.h);
  toast.h = setTimeout(() => (t.hidden = true), 2600);
}
function icons() { try { lucide.createIcons({ icons: lucide.icons }); } catch (e) {} }
function go(view, extra = {}) { Object.assign(state, { view }, extra); render(); window.scrollTo(0, 0); }

function renderNav() {

  const n = newEmails();
  $('#nav').innerHTML = `
    <div class="nav__brand">
      <span class="nav__brand-mark">${ic('hard-hat')}</span>
      <span class="nav__brand-text"><div class="nav__brand-name">Pawel</div><div class="nav__brand-kind">Contracting · Job Desk</div></span>

    ${item('projects', 'folder-kanban', 'Projects')}
    ${item('materials', 'package', 'Materials')}
    ${item('notes', 'notebook-pen', 'Notes')}
    <div class="nav__label">Manage</div>

    <div class="nav__account"><span class="avatar">${state.user[0]}</span><span><b>${state.user}</b><small>Primary Admin</small></span></div>`;
}

function extractBlock(e) {
  const x = e.extract;
  if (e.status === 'filed') {
    const p = proj(e.project);
    return `<div class="filed-banner">${ic('circle-check')}<span>Filed to <b>${esc(p.name)}, ${esc(p.address)}</b>.</span><button class="btn" data-proj="${p.id}">Open project</button></div>`;
  }
  const matTable = x.materials.length ? `
    <h4>Materials found</h4>
    <div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">Qty</th><th>Unit</th></tr></thead>
    <tbody>${x.materials.map((m) => `<tr><td>${esc(m.item)}</td><td class="num">${m.qty}</td><td>${esc(m.unit)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const todos = x.todos.length ? `<h4>To-dos</h4><ul class="todo">${x.todos.map((t) => `<li>${ic('square')}<span>${esc(t)}</span></li>`).join('')}</ul>` : '';
  const actions = x.kind === 'new'
    ? `<button class="btn btn--primary" data-act="create" data-email="${e.id}">${ic('folder-plus')}Create project</button><button class="btn" data-act="dismiss" data-email="${e.id}">Not a job</button>`
    : `<button class="btn btn--primary" data-act="file" data-email="${e.id}">${ic('check')}Add to ${esc(proj(x.project).name)}</button><button class="btn" data-act="dismiss" data-email="${e.id}">Ignore</button>`;
  return `
    <div class="extract">
      <div class="extract__head">${ic('sparkles')}<span class="grow">${x.kind === 'new' ? 'Looks like a new job. Here’s what Claude pulled out.' : 'Update for an existing job'}</span></div>
      <dl>${x.fields.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${matTable}${todos}
      <div class="extract__actions">${actions}</div>
    </div>`;
}

  return `
    <div class="page-head"><div><h1>Projects</h1><p>Every job, whether it came from an email or you added it yourself.</p></div>
      <button class="btn btn--primary" data-act="newproj">${ic('plus')}New project</button></div>

function matTable(p) {
  if (!p.materials.length) return `<div class="empty">No materials yet. Add one below or forward a supplier quote to your inbox.</div>`;
  const total = p.materials.reduce((s, m) => s + m.cost, 0);
  return `
    <div class="table-wrap"><table>
      <thead><tr><th>Item</th><th class="num">Qty</th><th>Unit</th><th>Supplier</th><th class="num">Cost</th><th>Status</th></tr></thead>
      <tbody>${p.materials.map((m, i) => `
        <tr><td>${esc(m.item)}</td><td class="num">${m.qty}</td><td>${esc(m.unit)}</td><td>${esc(m.supplier) || '<span class="sub">Not set</span>'}</td>
        <td class="num">${m.cost ? money(m.cost) : '–'}</td>
        <td><button class="status-btn" data-mat="${p.id}:${i}" title="Click to change status"><span class="mat-status ${MAT[m.status][1]}">${ic(MAT[m.status][2])}${MAT[m.status][0]}</span></button></td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="4" style="font-weight:600">Total</td><td class="num" style="font-weight:600">${money(total)}</td><td></td></tr></tfoot>
    </table></div>`;
}

  return notes.map((n) => `
    <div class="note">
      <div class="note__head"><span class="avatar" style="width:24px;height:24px;font-size:11px;${n.ai ? 'background:var(--ai-soft);color:var(--ai)' : ''}">${n.ai ? ic('sparkles') : n.who[0]}</span><b>${esc(n.who)}</b><span>${n.when}</span>${n.src ? `<span class="tag tag--new">${ic('mail')}From “${esc(n.src)}”</span>` : ''}${n.proj ? `<span class="tag">${ic('folder')}${esc(n.proj)}</span>` : ''}</div>
      <p>${esc(n.text)}</p>
    </div>`).join('') || '<div class="empty">No notes yet.</div>';
}

function composer(target) {
  return `
    <form class="composer" data-note="${target}">
      <label for="note-${target}" class="sub" style="font-size:12px;color:var(--muted)">New note</label>
      <textarea id="note-${target}" placeholder="What happened on site, what the client asked for, what to remember…"></textarea>
      <div class="composer__row">
        <select id="note-who-${target}" aria-label="Posting as"><option>Pawel</option><option>Marta</option><option>Luis</option></select>
        <button class="btn btn--primary" type="submit">${ic('send')}Add note</button>
      </div>
    </form>`;
}

function viewProject() {
  const p = proj(state.projectId);
  const t = state.tab;
  const tab = (k, l, c) => `<button class="tab ${t === k ? 'tab--active' : ''}" data-tab="${k}">${l}${c !== undefined ? `<span class="count">${c}</span>` : ''}</button>`;
  const spent = p.materials.reduce((s, m) => s + m.cost, 0);
  let body = '';
  if (t === 'overview') {
    body = `
      <div class="kv">
        <div><small>Status</small>${pill(p.status)}</div>
        <div><small>Start</small><b>${p.start}</b></div>
        <div><small>Job value</small><b>${money(p.budget)}</b></div>
        <div><small>Materials so far</small><b>${money(spent)}</b></div>
        <div><small>Progress</small><b>${p.progress}%</b><div class="progress"><i style="width:${p.progress}%"></i></div></div>
      </div>
      <div class="two-col section">
        <section><h2>Scope</h2><p style="margin:0;max-width:65ch">${esc(p.scope)}</p>
          <h2 style="margin-top:24px">Client</h2><p style="margin:0">${esc(p.client)}<br><span class="sub" style="color:var(--muted)">${esc(p.clientEmail)}</span></p></section>
        <section><h2>To-do</h2><ul class="todo">${p.todos.map((d, i) => `<li class="${d.done ? 'done' : ''}"><input type="checkbox" id="todo-${p.id}-${i}" data-todo="${p.id}:${i}" ${d.done ? 'checked' : ''}><label for="todo-${p.id}-${i}"><span>${esc(d.t)}</span></label></li>`).join('') || '<li><span class="sub">Nothing on the list.</span></li>'}</ul></section>
      </div>`;
  } else if (t === 'materials') {
    body = `<div class="callout" style="margin-bottom:14px">${ic('info')}<span>Click a status to move it along: Needed → Ordered → On site. Supplier quotes you forward are added here automatically.</span></div>${matTable(p)}`;
  } else if (t === 'notes') {
    body = `<div class="notes">${composer(p.id)}${noteList(p.notes)}</div>`;
  } else {
    const ems = state.emails.filter((e) => e.project === p.id && e.status === 'filed');
    body = ems.length ? `<div class="table-wrap"><table><thead><tr><th>From</th><th>Subject</th><th>Received</th></tr></thead><tbody>${ems.map((e) => `<tr class="clickable" data-email-open="${e.id}"><td class="strong">${esc(e.from)}</td><td>${esc(e.subject)}</td><td>${e.time}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No emails filed to this project yet.</div>';
  }
  return `
    <button class="back" data-go="projects">${ic('arrow-left')}All projects</button>
    <div class="page-head"><div><h1>${esc(p.name)}</h1>
      <div class="proj-meta"><span>${ic('map-pin')}${esc(p.address)}</span><span>${ic('user')}${esc(p.client)}</span><span>${ic('calendar')}Starts ${p.start}</span></div></div>
      <div>${pill(p.status)}</div></div>
    <div class="tabs">${tab('overview', 'Overview')}${tab('materials', 'Materials', p.materials.length)}${tab('notes', 'Notes', p.notes.length)}${tab('emails', 'Emails', state.emails.filter((e) => e.project === p.id && e.status === 'filed').length)}</div>
    <div class="tab-body">${body}</div>`;
}

function viewMaterials() {
  const open = allMaterials().filter((m) => m.status !== 'onsite');
  const bySup = {};
  open.forEach((m) => (bySup[m.supplier || 'No supplier yet'] ||= []).push(m));
  return `
    <div class="page-head"><div><h1>Materials</h1><p>Everything not on site yet, across every open job, grouped by supplier so you can order in one call.</p></div></div>
    <div class="section">${Object.entries(bySup).map(([s, items]) => `
      <div class="supplier">
        <h3>${ic('truck')}${esc(s)} <small>${items.length} items${items.some((m) => m.cost) ? ' · ' + money(items.reduce((a, m) => a + m.cost, 0)) : ''}</small></h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Item</th><th class="num">Qty</th><th>Unit</th><th>Job</th><th>Status</th></tr></thead>
          <tbody>${items.map((m) => `
            <tr><td>${esc(m.item)}</td><td class="num">${m.qty}</td><td>${esc(m.unit)}</td>
            <td><button class="btn btn--ghost" style="padding:0;color:var(--link)" data-proj="${m.p.id}" data-tabto="materials">${esc(m.p.name)}</button></td>
            <td><button class="status-btn" data-mat="${m.p.id}:${m.i}"><span class="mat-status ${MAT[m.status][1]}">${ic(MAT[m.status][2])}${MAT[m.status][0]}</span></button></td></tr>`).join('')}
          </tbody></table></div>
      </div>`).join('') || '<div class="empty">Everything is on site.</div>'}
    </div>`;
}

function viewNotes() {
  const all = [
    ...state.generalNotes,
    ...state.projects.flatMap((p) => p.notes.map((n) => ({ ...n, proj: p.name }))),
  ];
  return `
    <div class="page-head"><div><h1>Notes</h1><p>General notes plus everything written on a job, newest first. Anyone logged in can add one.</p></div></div>
    <div class="section notes">${composer('general')}${noteList(all)}</div>`;
}

function viewUsers() {
  return `
    <div class="page-head"><div><h1>Users</h1><p>Who can log in. Admins see everything; crew can view jobs and add notes.</p></div>
      <button class="btn btn--primary" data-act="invite">${ic('user-plus')}Add user</button></div>
    <div class="section table-wrap"><table>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last active</th></tr></thead>
      <tbody>${state.users.map((u) => `<tr><td><span style="display:flex;align-items:center;gap:10px"><span class="avatar">${u.name[0]}</span><span class="strong">${esc(u.name)}</span></span></td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.last}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="section callout">${ic('info')}<span>Invite by email, they set a password, and the primary admin can change roles or turn access off at any time.</span></div>`;
}

function render() {
  renderNav();
  const views = { dashboard: viewDashboard, inbox: viewInbox, projects: viewProjects, project: viewProject, materials: viewMaterials, notes: viewNotes, users: viewUsers };
  $('#main').innerHTML = `<div class="mock-note">${ic('flask-conical')}<span><b>Mockup</b> · sample jobs and emails. Click around; changes last until you reload.</span></div>` + views[state.view]();
  icons();
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-go],[data-proj],[data-tab],[data-email-sel],[data-email-open],[data-act],[data-mat],[data-filter]');
  if (!el) return;
  const d = el.dataset;
  if (d.mat) {
    const [pid, i] = d.mat.split(':');
    const m = proj(pid).materials[+i];
    m.status = MAT_NEXT[m.status];
    state.activity.unshift({ icon: 'truck', text: `<b>${state.user}</b> marked <b>${esc(m.item)}</b> as ${MAT[m.status][0].toLowerCase()}`, when: 'Just now' });
    render();
    return;
  }
  if (d.go) return go(d.go);
  if (d.proj) return go('project', { projectId: d.proj, tab: d.tabto || 'overview' });
  if (d.tab) { state.tab = d.tab; return render(); }
  if (d.filter) { state.projFilter = d.filter; return render(); }
  if (d.emailSel) { state.emailId = d.emailSel; return render(); }
  if (d.emailOpen) return go('inbox', { emailId: d.emailOpen });
  if (d.act === 'create') {
    const e = email(d.email);
    const f = Object.fromEntries(e.extract.fields);
    const id = 'p' + (state.projects.length + 1);
    state.projects.unshift({
      id, name: f['Job'], address: f['Address'], client: f['Client'], clientEmail: e.addr, status: 'quote', start: f['Target start'], budget: 38000, progress: 0,
      scope: 'Remove existing oak cabinets and install white shaker cabinets, quartz countertops with undermount sink, subway tile backsplash, relocate fridge with new outlet, add 6 recessed lights.',
      todos: e.extract.todos.map((t) => ({ t, done: false })),
      materials: e.extract.materials.map((m) => ({ ...m })),
      notes: [{ who: 'Claude', ai: true, when: 'Just now', text: 'Opened from Karen’s email. Referred by the Shahs (Basement finish, 55 Crestview Dr). Budget about $38k, flexible. Wants to start around Oct 19.', src: e.subject }],
    });
    e.status = 'filed'; e.project = id;
    state.activity.unshift({ icon: 'folder-plus', ai: true, text: `<b>Claude</b> opened project <b>${esc(f['Job'])}, ${esc(f['Address'])}</b> from an email`, when: 'Just now' });
    toast('Project created with 6 materials and 3 to-dos');
    return go('project', { projectId: id, tab: 'overview' });
  }
  if (d.act === 'file') {
    const e = email(d.email);
    const p = proj(e.extract.project);
    p.materials.push(...e.extract.materials.map((m) => ({ ...m })));
    p.todos.push(...e.extract.todos.map((t) => ({ t, done: false })));
    if (e.extract.closeTodo) p.todos.forEach((t) => { if (t.t === e.extract.closeTodo) t.done = true; });
    p.notes.unshift({ who: 'Claude', ai: true, when: 'Just now', text: e.extract.fields.slice(1).map(([k, v]) => `${k}: ${v}`).join('\n'), src: e.subject });
    e.status = 'filed';
    state.activity.unshift({ icon: 'sparkles', ai: true, text: `<b>Claude</b> filed “${esc(e.subject)}” to <b>${esc(p.name)}</b>`, when: 'Just now' });
    toast(`Added to ${p.name}`);
    return render();
  }
  if (d.act === 'dismiss') { email(d.email).status = 'ignored'; return render(); }
  if (d.act === 'newproj') return toast('In the real app this opens a blank project form');
  if (d.act === 'invite') return toast('In the real app this sends an email invite');
});

document.addEventListener('change', (ev) => {
  const d = ev.target.dataset;
  if (d.todo) {
    const [pid, i] = d.todo.split(':');
    proj(pid).todos[+i].done = ev.target.checked;
    render();
  }
});

document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('[data-note]');
  if (!form) return;
  ev.preventDefault();
  const target = form.dataset.note;
  const text = form.querySelector('textarea').value.trim();
  if (!text) return;
  const who = form.querySelector('select').value;
  const note = { who, when: 'Just now', text };
  if (target === 'general') state.generalNotes.unshift(note);
  else proj(target).notes.unshift(note);
  state.activity.unshift({ icon: 'notebook-pen', text: `<b>${who}</b> added a note${target === 'general' ? '' : ` to <b>${esc(proj(target).name)}</b>`}`, when: 'Just now' });
  toast('Note added');
  render();
});

render();
</script>

</body></html>
